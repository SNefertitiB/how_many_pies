<!DOCTYPE html>
<html>
<body>
  <h1>How Many Pies?</h1>
  <p>Number of people: </p> <p id="num_people"></p>
  <p></p>
  <input id="input_people" type="int" placeholder="8">
  <p>Slices per person: </p> <p id="slices_per_person"></p>
  <p>Slices per pie: </p> <p id="slices_per_pie"></p>
  <p>Number of pies: </p> <p id="pies"></p>

<script>

  let people;

  const input_people = document.getElementById("input_people");
  input_people.addEventListener("change", function (event) {
    document.getElementById("num_people").innerHTML = event.text;
  });

  
  slice_per_person = 2;
  document.getElementById("slices_per_person").innerHTML = slice_per_person;
  
  slice_per_pie = 8;
  document.getElementById("slices_per_pie").innerHTML = slice_per_pie;
  
  pies = (people * slice_per_person) / slice_per_pie;
  document.getElementById("pies").innerHTML = Math.ceil(pies);

</script>

</body>
</html>
